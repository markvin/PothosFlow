name: CI

on:
  push:
  pull_request:

env:
  # the branches of the Pothos core and of the toolkit that flow builds and
  # runs against (blocks: the block cache of the smoke test)
  POTHOS_CORE_REPO: markvin/PothosCore
  POTHOS_CORE_REF: pothos2
  POTHOS_BLOCKS_REPO: markvin/PothosBlocks
  POTHOS_BLOCKS_REF: pothos2
  # the minimum Qt version of flow (Ubuntu 24.04 has Qt 6.4: too old).
  # A matrix entry can give a different Qt with "qt".
  QT_VERSION: '6.5.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            config: Debug
            extra: "-DFLOW_WARNINGS_AS_ERRORS=ON"
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            config: Release
            extra: "-DFLOW_WARNINGS_AS_ERRORS=ON"
          - name: macos
            # temporary Intel (x86_64) runner, the same as the core
            os: macos-15-intel
            cc: clang
            cxx: clang++
            config: Debug
            extra: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
            core_extra: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
          - name: windows
            os: windows-latest
            cc: cl
            cxx: cl
            config: Release
            extra: ""
            # the headers of Qt 6.5.3 use stdext checked iterators, which
            # the MSVC of windows-latest does not have any more
            qt: '6.8.3'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.POTHOS_CORE_REPO }}
          ref: ${{ env.POTHOS_CORE_REF }}
          path: pothos-core

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.POTHOS_BLOCKS_REPO }}
          ref: ${{ env.POTHOS_BLOCKS_REF }}
          path: pothos-blocks

      # the build must never download anything
      - name: No network access in the build
        shell: bash
        run: |
          if grep -rnE 'file\s*\(\s*DOWNLOAD|FetchContent|ExternalProject' --include=CMakeLists.txt --include='*.cmake' . \
              --exclude-dir=pothos-core --exclude-dir=pothos-blocks; then
            echo "build scripts must not download anything"; exit 1
          fi

      # Ninja; the OpenGL and EGL headers and libraries for the Qt Gui package
      - name: Install Ninja and the Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libxkbcommon-dev libfontconfig1

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # the dependencies of the core and blocks come from Conan 2; flow
      # needs no Conan packages. CC/CXX select the compiler.
      - name: Dependencies of the core and blocks (Conan)
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          pipx install "conan>=2,<3"
          conan profile detect --force
          for dir in pothos-core pothos-blocks; do
            conan install $dir --output-folder=$dir/build/conan \
              -s build_type=${{ matrix.config }} -s compiler.cppstd=23 --build=missing \
              -c tools.cmake.cmaketoolchain:generator=Ninja
          done

      # binary Qt from the Qt mirrors; sets QT_ROOT_DIR and puts the Qt bin
      # directory on PATH (Windows finds the Qt DLLs there)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt || env.QT_VERSION }}
          cache: true

      - name: Build and install the core
        shell: bash
        run: |
          #a path that CMake understands on Windows too (pwd -W: D:/a/...)
          prefix="$(pwd -W 2>/dev/null || pwd)/pothos-install"
          echo "POTHOS_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake -S pothos-core -B pothos-core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/conan_toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DPOTHOS_BUILD_TESTS=OFF -DPOTHOS_BUILD_DOCS=OFF \
            ${{ matrix.core_extra }}
          cmake --build pothos-core/build
          cmake --install pothos-core/build

      # the smoke test checks the block cache: install PothosBlocks into the core prefix
      - name: Build and install PothosBlocks
        shell: bash
        run: |
          cmake -S pothos-blocks -B pothos-blocks/build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH="$POTHOS_PREFIX" \
            -DBLOCKS_BUILD_TESTS=OFF \
            ${{ matrix.core_extra }}
          cmake --build pothos-blocks/build
          cmake --install pothos-blocks/build

      # the Qt prefix with forward slashes (cygpath -m on Windows)
      - name: Configure
        shell: bash
        run: |
          qt="$QT_ROOT_DIR"
          if command -v cygpath >/dev/null; then qt="$(cygpath -m "$qt")"; fi
          echo "FLOW_QT_PREFIX=$qt" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$POTHOS_PREFIX;$qt" \
            ${{ matrix.extra }}

      # keep going after the first error to report all of them in one run
      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        #-V: the output of the smoke test (also when it passes)
        run: ctest --test-dir build --output-on-failure -V

      # Qt and the core are not in system directories: the staged executable
      # must have an RPATH to their library directories, and a relative
      # RPATH to PothosQtColorPicker
      - name: Check the install RPATH
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: |
          rpath=$(readelf -d build/stage/bin/PothosFlow | grep -E 'RUNPATH|RPATH')
          echo "$rpath"
          echo "$rpath" | grep -F "$FLOW_QT_PREFIX/lib"
          echo "$rpath" | grep -F "$POTHOS_PREFIX/lib"
          echo "$rpath" | grep -F '$ORIGIN/../lib'

  linux-system:
    name: linux-system (Arch packages)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      #an init process as PID 1 reaps orphans (the same as the core CI)
      options: --init
    steps:
      #asio, nlohmann-json and xsimd are for the core and blocks; qt6-base is for flow
      - name: Install the toolchain and the dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja git asio nlohmann-json xsimd qt6-base

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.POTHOS_CORE_REPO }}
          ref: ${{ env.POTHOS_CORE_REF }}
          path: pothos-core

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.POTHOS_BLOCKS_REPO }}
          ref: ${{ env.POTHOS_BLOCKS_REF }}
          path: pothos-blocks

      - name: Build and install the core and blocks
        run: |
          cmake -S pothos-core -B pothos-core/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/pothos-install" \
            -DPOTHOS_BUILD_TESTS=OFF -DPOTHOS_BUILD_DOCS=OFF
          cmake --build pothos-core/build
          cmake --install pothos-core/build
          cmake -S pothos-blocks -B pothos-blocks/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$PWD/pothos-install" \
            -DBLOCKS_BUILD_TESTS=OFF
          cmake --build pothos-blocks/build
          cmake --install pothos-blocks/build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$PWD/pothos-install"
          -DFLOW_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure -V
